# Publishes the site to GitHub Pages:
#   /      -> RECAST AI+ (static files at the repo root)
#   /vox/  -> ZMF VOX STUDIO+ (built from vox/)
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vox/package-lock.json
      - name: Build ZMF VOX STUDIO+
        working-directory: vox
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'vox' --exclude 'tests' --exclude '_site' ./ _site/
          mkdir -p _site/vox
          cp -r vox/dist/. _site/vox/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}vox/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
